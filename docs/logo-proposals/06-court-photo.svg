<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Angle de court et balle — composition minimaliste</title>
  <desc>Surfaces bleu et vert sauge, lignes ivoire en V et balle citron. Groupes séparés pour recomposer le visuel.</desc>
  <defs>
    <clipPath id="ball-boundary">
      <circle cx="512" cy="570" r="112"/>
    </clipPath>
  </defs>
  <g id="court">
    <path id="surface-verte" d="M0 0 H1024 V1024 H0 Z" fill="#97AC7D"/>
    <path id="surface-bleue" d="M0 0 H1024 V310 L512 650 L0 355 Z" fill="#579FAC"/>
  </g>
  <g id="lignes" fill="none" stroke="#F3F0DD" stroke-width="52" stroke-linejoin="miter">
    <path d="M-30 337.71 L512 650 L1054 290.08"/>
  </g>
  <g id="balle">
    <circle id="corps" cx="512" cy="570" r="112" fill="#CCE176"/>
    <path id="couture" d="M448 478.15 C409 523 396 600 448 636 C500 680 562 629 620 540.34" fill="none" stroke="#627B40" stroke-width="7.5" stroke-linecap="round" clip-path="url(#ball-boundary)"/>
  </g>
</svg>
